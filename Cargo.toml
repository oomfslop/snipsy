[package]
name = "snipsy"
version = "0.1.0"
edition = "2024"
description = "Native macOS screenshot editor and floating image pins"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
glam = { version = "0.30", features = ["serde"] }
global-hotkey = { version = "0.8", features = ["serde"] }
gpui-kit = "0.7.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "tga"] }
resvg = "0.45"
tempfile = "3"
unicode-segmentation = "1"
lyon = "1"
tray-icon = "0.26.1"

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = { version = "0.3", default-features = false, features = ["CMSampleBuffer", "CMTime", "objc2"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-media"] }
objc2-uniform-type-identifiers = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
