[package]
name = "snipsy"
version = "0.1.0"
edition = "2024"
description = "Native macOS screenshot editor and floating image pins"

[dependencies]
base64 = "0.22"
glam = "0.30"
global-hotkey = "0.8"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
resvg = "0.45"
tempfile = "3"
unicode-segmentation = "1"
lyon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-uniform-type-identifiers = "0.3"

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[patch.crates-io]
gpui = { path = "vendor/gpui" }
